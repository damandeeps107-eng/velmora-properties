name: Build Velmora Admin APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Gradle
        run: |
          cd android
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy Built APK
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/VelmoraAdmin.apk
          cp downloads/VelmoraAdmin.apk VelmoraAdmin.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VelmoraAdmin-APK
          path: downloads/VelmoraAdmin.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Velmora Properties Admin App APK
          body: |
            ## Velmora Properties - Official Android Admin App (.APK)
            
            Aap is APK file ko kisi bhi Android mobile mein download karke install kar sakte hain aur kisi ke sath bhi share kar sakte hain:
            
            - **File Name**: `VelmoraAdmin.apk`
            - **Target**: Android 5.0 to Android 14+
            - **Interconnected**: Real-time connected with https://www.velmoraproperty.com
            - **Features**: Property listing, Finder/camera photo upload, Customer inquiries CRM, 1-click WhatsApp.
            - **Default PIN**: `7860`
          files: downloads/VelmoraAdmin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit APK to repository for direct website download
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/VelmoraAdmin.apk VelmoraAdmin.apk
          git commit -m "chore: Update VelmoraAdmin.apk binary [skip ci]" || echo "No changes to commit"
          git push origin main
